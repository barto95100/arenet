#
# TEMPORARY diagnostic build — lives ONLY on the throwaway branch
# diag/automation-trigger-trace, never merged to main. Builds the
# linux binary (amd64 + arm64) with the DIAG trigger-trace logging
# and uploads it as a downloadable Actions artifact. No GHCR push,
# no GitHub Release — unlike release.yml, which is reserved for v*
# tags. Delete this file when the diag branch is dropped.

name: diag-binary

on:
  push:
    branches:
      - 'diag/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-binary:
    name: Build diag binary (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve version label
        id: meta
        run: |
          set -euo pipefail
          VERSION="diag-${GITHUB_SHA::7}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version=${VERSION}"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Build frontend (for //go:embed)
        working-directory: web/frontend
        run: |
          npm ci
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Build binary
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          set -euo pipefail
          OUT="arenet-linux-${{ matrix.arch }}"
          go build \
            -ldflags "-s -w -X main.version=${{ steps.meta.outputs.version }}" \
            -trimpath \
            -o "$OUT" \
            ./cmd/arenet
          chmod +x "$OUT"
          file "$OUT"
          echo "Built ${OUT} with version=${{ steps.meta.outputs.version }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v6
        with:
          name: arenet-linux-${{ matrix.arch }}
          path: arenet-linux-${{ matrix.arch }}
          retention-days: 3
